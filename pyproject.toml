[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evidence-kit"
version = "0.1.0"
description = "A small toolkit for keeping research claims and documentation honest."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "willind" }]
keywords = ["research", "evidence", "documentation", "drift", "deduplication", "ledger"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
test = ["pytest>=7", "pyyaml>=6.0"]

[project.scripts]
doc-claims = "evidence_kit.doc_claims:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_kit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README*.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
